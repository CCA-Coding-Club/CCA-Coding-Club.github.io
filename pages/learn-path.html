<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Learning Path — CCA Coding Club</title>
  <meta name="description" content="Interactive learning path graph for CCA Coding Club." />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet" />

  <!-- Favicon -->
  <link rel="icon" href="../assets/mascot.png" />

  <!-- Styles -->
  <link rel="stylesheet" href="../css/base/variables.css" />
  <link rel="stylesheet" href="../css/base/reset.css" />
  <link rel="stylesheet" href="../css/components/navbar.css" />
  <link rel="stylesheet" href="../css/components/graph.css" />
  <link rel="stylesheet" href="../css/pages/learn.css" />
</head>

<body>

  <!-- Navigation (generated by navbar.js) -->
  <div id="navbar"></div>

  <!-- Page Content -->
  <main class="learn-path-page">
    <div class="path-page-header">
      <a class="btn-back" href="learn.html">← All Paths</a>
      <h1 id="path-title">Loading...</h1>
    </div>

    <div class="graph-container">
      <div id="graph-container">
        <div class="status-message">Loading graph...</div>
      </div>
    </div>

    <div class="graph-legend">
      <span class="legend-item"><span class="legend-dot locked"></span>Locked</span>
      <span class="legend-item"><span class="legend-dot available"></span>Available — click to open</span>
      <span class="legend-item"><span class="legend-dot complete"></span>Complete</span>
      <span class="legend-item" id="progress-label" style="margin-left:auto; color: var(--text-dim)"></span>
    </div>
  </main>

  <!-- Firebase (compat SDK — works as regular script tags, no modules needed) -->
  <script src="https://www.gstatic.com/firebasejs/11.6.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore-compat.js"></script>

  <!-- Our scripts (order matters: firebase-config first, then the rest) -->
  <script src="../js/base/firebase-config.js"></script>
  <script src="../js/components/navbar.js"></script>
  <script src="../js/base/learn-config.js"></script>
  <script src="../js/pages/learn-path.js"></script>

</body>

</html>
