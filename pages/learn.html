<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Learn — CCA Coding Club</title>
  <meta name="description" content="Guided learning paths for CCA Coding Club members." />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet" />

  <!-- Favicon -->
  <link rel="icon" href="../assets/favicon.svg" />

  <!-- Styles -->
  <link rel="stylesheet" href="../css/base/variables.css" />
  <link rel="stylesheet" href="../css/base/reset.css" />
  <link rel="stylesheet" href="../css/components/navbar.css" />
  <link rel="stylesheet" href="../css/pages/learn.css" />
</head>

<body>

  <!-- Navigation (generated by navbar.js) -->
  <div id="navbar"></div>

  <!-- Page Content -->
  <main class="learn-page">
    <h1>Learning Paths</h1>
    <p>Follow a guided path to learn new skills. Complete nodes in order — each one unlocks the next.</p>

    <div id="paths-grid" class="paths-grid">
      <div class="status-message">Loading paths...</div>
    </div>
  </main>

  <!-- Firebase (compat SDK — works as regular script tags, no modules needed) -->
  <script src="https://www.gstatic.com/firebasejs/11.6.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore-compat.js"></script>

  <!-- Our scripts (order matters: firebase-config first, then the rest) -->
  <script src="../js/base/firebase-config.js"></script>
  <script src="../js/components/navbar.js"></script>
  <script src="../js/pages/learn.js"></script>

</body>

</html>
