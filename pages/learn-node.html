<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Learn — CCA Coding Club</title>
  <meta name="description" content="Learning node content for CCA Coding Club." />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet" />

  <!-- Favicon -->
  <link rel="icon" href="../assets/favicon.svg" />

  <!-- Styles -->
  <link rel="stylesheet" href="../css/base/variables.css" />
  <link rel="stylesheet" href="../css/base/reset.css" />
  <link rel="stylesheet" href="../css/components/navbar.css" />
  <link rel="stylesheet" href="../css/components/markdown.css" />
  <link rel="stylesheet" href="../css/pages/learn.css" />

  <!-- Highlight.js — syntax highlighting for code blocks (~15KB) -->
  <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.11.1/build/styles/atom-one-dark.min.css" />
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.11.1/build/highlight.min.js"></script>

  <!-- Marked.js — markdown renderer -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>

<body>

  <!-- Navigation (generated by navbar.js) -->
  <div id="navbar"></div>

  <!-- Page Content -->
  <main class="learn-node-page">
    <nav class="node-nav">
      <a id="path-link" class="btn-back" href="learn.html">Path</a>
      <span style="color: var(--text-dim)">›</span>
      <span id="node-title" style="font-weight:500"></span>
      <span id="node-badge" class="node-type-badge"></span>
    </nav>

    <div class="node-content-body markdown" id="node-content">
      <div class="status-message">Loading content...</div>
    </div>

    <div class="node-actions" id="node-actions"></div>
  </main>

  <!-- Firebase (compat SDK — works as regular script tags, no modules needed) -->
  <script src="https://www.gstatic.com/firebasejs/11.6.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore-compat.js"></script>

  <!-- Our scripts (order matters: firebase-config first, then the rest) -->
  <script src="../js/base/firebase-config.js"></script>
  <script src="../js/components/navbar.js"></script>
  <script src="../js/base/learn-config.js"></script>
  <script src="../js/pages/learn-node.js"></script>

</body>

</html>
